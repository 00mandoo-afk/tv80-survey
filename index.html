<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설문조사 마감</title>
  <style>
    body { 
      margin: 0; padding: 0; 
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }
    .container {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 60px 40px;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.2);
    }
    h1 { font-size: 2.2rem; margin: 0 0 20px 0; font-weight: 900; }
    p { font-size: 1.2rem; margin: 0 0 25px 0; line-height: 1.6; }
    .gift { 
      background: rgba(255,255,255,0.2); 
      padding: 20px 30px; 
      border-radius: 15px; 
      margin: 30px 0; 
      font-size: 1.3rem;
      font-weight: 700;
    }
    .close-btn {
      padding: 20px 50px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255,107,107,0.4);
      transition: all 0.3s;
    }
    .close-btn:hover {
      background: #ff5252;
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(255,107,107,0.5);
    }
    .contact { font-size: 1rem; opacity: 0.9; margin-top: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎉 설문조사 완료!</h1>
    <p><strong>'80년대생 부모에게 거실 TV는 어떤 의미인가?'</strong><br>조사가 마무리되었습니다.</p>
    <div class="gift">
      💝 <strong>기프티콘은</strong><br>
      2026년 1월 연락처로 발송됩니다!
    </div>
    <button class="close-btn" onclick="window.close();">
      창 닫기
    </button>
    <div class="contact">
      📞 연구책임자: 강승화<br>
      00mandoo@naver.com
    </div>
  </div>
  
  <script>
    // 모든 조작 차단
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' || e.key === 'F5' || 
          (e.ctrlKey && e.key === 'r') || 
          (e.ctrlKey && e.key === 'n')) {
        e.preventDefault();
      }
    });
    window.addEventListener('beforeunload', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
